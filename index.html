<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Diğer gerekli stil dosyaları (Bootstrap, FontAwesome vs) -->
</head>
<body>

  <!-- Buraya login form içeriğini ekle -->
  <div class="login-form">
    <!-- Şablondan alınan form buraya -->
    <form action="table.html" method="POST">
      <h2 class="text-center">Giriş Yap</h2>       
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Kullanıcı Adı" required="required" name="username">
      </div>
      <div class="form-group">
        <input type="password" class="form-control" placeholder="Şifre" required="required" name="password">
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-primary btn-block">Giriş</button>
      </div>   
    </form>
  </div>

</body>
</html>
